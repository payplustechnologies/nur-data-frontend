<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="../users/assets/img/nur-data-logo.svg?v=3">
  <title>Admin Login · Nur Data</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../users/assets/css/app.css?v=20260907-3">
  <link rel="stylesheet" href="../users/assets/css/auth.css?v=20260907-3">
  <link rel="stylesheet" href="../users/assets/css/alerts.css?v=20260907-3">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-intro">
      <div class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></div>
      <span class="eyebrow">SECURE ADMINISTRATION</span>
      <h1>Everything you need,<br>in one control centre.</h1>
      <p>Manage users, transactions and essential services with confidence.</p>
    </section>
    <section class="auth-card">
      <div class="mobile-brand"><span class="brand-mark small"><i class="bi bi-lightning-charge-fill"></i></span><b data-brand-name>Nur Data</b></div>
      <h2>Welcome back</h2>
      <p class="muted">Enter your details to access the admin dashboard.</p>
      <form id="login-form" novalidate>
        <label for="username">Username or email</label>
        <div class="field"><i class="bi bi-person"></i><input id="username" autocomplete="username" placeholder="Enter username or email" required></div>
        <label for="password">Password</label>
        <div class="field"><i class="bi bi-lock"></i><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button class="icon-btn" id="toggle-password" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
        <div class="form-links"><span><i class="bi bi-shield-check"></i> Secure administrator access</span></div>
        <button class="primary-btn" type="submit"><span>Sign in</span><i class="bi bi-arrow-right"></i></button>
      </form>
      <p class="auth-foot">Authorized administrators only · <b data-brand-name>Nur Data</b></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="./assets/js/login.js?v=20260913-1"></script>
</body>
</html>
