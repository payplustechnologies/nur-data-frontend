<!doctype html><html lang="en"><head><base href="/users/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="./assets/img/nur-data-logo.svg?v=2"><title>Reset password · Nur Data</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="./assets/css/app.css"></head><body class="auth-page"><main class="auth-wrap"><section class="auth-intro"><div class="brand-mark"><i class="bi bi-shield-check"></i></div><span class="eyebrow">SECURE PASSWORD RESET</span><h1>Create a new,<br>strong password.</h1><p>Enter the code from your email and choose a password you haven’t used before.</p></section><section class="auth-card"><div class="mobile-brand"><span class="brand-mark small"><i class="bi bi-lightning-charge-fill"></i></span><b data-brand-name>Nur Data</b></div><span class="auth-icon"><i class="bi bi-unlock"></i></span><h2>Reset password</h2><p class="muted">Your verification code contains six digits.</p><form id="reset-form" novalidate><label for="email">Email address</label><div class="field"><i class="bi bi-envelope"></i><input id="email" type="email" autocomplete="email" required></div><label for="otp">Verification code</label><div class="field otp-field"><i class="bi bi-shield-lock"></i><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required></div><label for="password">New password</label><div class="field"><i class="bi bi-lock"></i><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="icon-btn password-toggle" type="button" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div><label for="confirmation">Confirm password</label><div class="field"><i class="bi bi-lock-fill"></i><input id="confirmation" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat your password" required></div><button class="primary-btn" type="submit"><span>Reset password</span><i class="bi bi-check2-circle"></i></button></form><p class="auth-foot">Didn’t get a code? <a href="./forgot-password/">Send another</a></p></section></main><div class="toast" data-toast></div><script type="module" src="./assets/js/reset-password.js"></script></body></html>
