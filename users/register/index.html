<!doctype html>
<html lang="en"><head><base href="/users/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/svg+xml" href="./assets/img/nur-data-logo.svg?v=2"><title>Create account · Nur Data</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="./assets/css/app.css"></head>
<body class="auth-page"><main class="auth-wrap"><section class="auth-intro"><div class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></div><span class="eyebrow">JOIN NUR DATA</span><h1>Your everyday services,<br>made simpler.</h1><p>Create a secure wallet for data, airtime, bills and more.</p></section>
<section class="auth-card auth-card-wide"><div class="mobile-brand"><span class="brand-mark small"><i class="bi bi-lightning-charge-fill"></i></span><b data-brand-name>Nur Data</b></div><h2>Create account</h2><p class="muted">Enter your details to get started.</p><form id="register-form" novalidate>
<div class="form-grid"><div><label for="name">Full name</label><div class="field"><i class="bi bi-person"></i><input id="name" autocomplete="name" placeholder="Your full name" required></div></div><div><label for="username">Username</label><div class="field"><i class="bi bi-at"></i><input id="username" autocomplete="username" minlength="5" maxlength="32" placeholder="Choose a username" required></div></div></div>
<label for="email">Email address</label><div class="field"><i class="bi bi-envelope"></i><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><label for="phone">Phone number</label><div class="field"><i class="bi bi-phone"></i><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" minlength="11" maxlength="11" placeholder="08012345678" required></div><label for="ref">Referral username <span class="optional">Optional</span></label><div class="field"><i class="bi bi-person-plus"></i><input id="ref" maxlength="32" placeholder="Referrer's username"></div>
<div class="form-grid"><div><label for="password">Password</label><div class="field"><i class="bi bi-lock"></i><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="8+ characters" required><button class="icon-btn password-toggle" type="button" data-target="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div><label for="pin">Transaction PIN</label><div class="field"><i class="bi bi-shield-lock"></i><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" required></div></div></div>
<label class="check-row"><input id="terms" type="checkbox" required><span>I agree to the Terms and <a href="/privacy-policy/" target="_blank" rel="noopener">Privacy Policy</a>.</span></label><button class="primary-btn" type="submit"><span>Create account</span><i class="bi bi-arrow-right"></i></button></form><p class="auth-foot">Already registered? <a href="./login/">Sign in</a></p></section></main><div class="toast" data-toast></div><script type="module" src="./assets/js/register.js"></script></body></html>
